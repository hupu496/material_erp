{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">
    <div class="card shadow-lg" style="max-width: 700px; margin: 0 auto;">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0"><i class="fas fa-file-alt"></i> Master Report Form</h3>
        </div>
        <div class="card-body">

            <form method="POST">
                {% csrf_token %}

                <div class="mb-4">
                    <label class="form-label fw-bold">SELECT</label>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="report_type" id="party" value="party" checked>
                                <label class="form-check-label" for="party">
                                    <strong>Party Master</strong>
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="report_type" id="material" value="material">
                                <label class="form-check-label" for="material">
                                    <strong>Material Master</strong>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
<div class="mb-4">
    <label class="form-label fw-bold">Category</label>

    <select name="category" id="category"
            class="form-select form-control-modern"
            style="height:45px;">

        <option value="">-- All Categories --</option>

        {% for cat in categories %}
        <option value="{{ cat.id }}">
            {{ cat.name }}
        </option>
        {% endfor %}
    </select>
</div>

<div class="mb-4">
    <label class="form-label fw-bold">Sub Category</label>

    <select name="subcategory" id="subcategory"
            class="form-select form-control-modern"
            style="height:45px;">

        <option value="">-- All Sub Categories --</option>
    </select>
</div>

                <div class="mb-4">
                    <label class="form-label fw-bold">Download Format</label>
                    <div class="d-flex gap-3">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="format" id="xlsx" value="xlsx" >
                            <label class="form-check-label" for="xlsx">Excel (.xlsx)</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="format" id="csv" value="csv">
                            <label class="form-check-label" for="csv">CSV</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="format" id="pdf" value="pdf" checked>
                            <label class="form-check-label" for="pdf">PDF</label>
                        </div>
                    </div>
                </div>

                <div class="text-center mt-4">
                    <button type="submit" class="btn btn-success btn-lg px-5">
                        <i class="fas fa-download"></i> Generate & Download Report
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>
<script>
document.getElementById("category").addEventListener("change", function () {

    const categoryId = this.value;

    const subcategory =
        document.getElementById("subcategory");

    subcategory.innerHTML =
        '<option value="">-- All Sub Categories --</option>';

    if (!categoryId) return;

    fetch(`/reports/load-subcategories/?category=${categoryId}`)

        .then(response => response.json())

        .then(data => {

            data.forEach(sub => {

                const option =
                    document.createElement("option");

                option.value = sub.id;

                option.textContent =
                    sub.sub_category;

                subcategory.appendChild(option);
            });
        });
});
</script>
{% endblock %}
